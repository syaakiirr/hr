# SociHR gateway — reverse proxy + load balancer for the .NET API/SPA.
# Mounted at /etc/nginx/conf.d/default.conf (inside the http{} block).

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream socihr_api {
    least_conn;
    server api1:8080 max_fails=3 fail_timeout=10s;
    server api2:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;

    # The backend reads the real client IP from these (IpRateLimit.RealIpHeader
    # is X-Forwarded-For). SOCIHR_BEHIND_PROXY=true enables ASP.NET's
    # ForwardedHeaders middleware so Connection.RemoteIpAddress matches too.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    add_header X-Gateway "socihr" always;

    # Streaming / long-lived endpoints must not be buffered.
    location /api/events {
        proxy_buffering off;
        proxy_pass http://socihr_api;
    }

    # API — edge rate limit as a first line of defence. The per-endpoint limits
    # in appsettings.json still apply per API instance, so with N replicas the
    # effective limit is N×. Use a shared store (Redis) if that matters.
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://socihr_api;
    }

    # SPA shell + hashed static assets, served by the API containers.
    location / {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://socihr_api;
    }
}
