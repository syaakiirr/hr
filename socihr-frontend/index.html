<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <style>
      @font-face {
        font-family:'Geist';font-style:normal;font-weight:100 900;font-display:swap;
        src:url('/fonts/Geist.woff2') format('woff2');
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      @font-face {
        font-family:'Geist Mono';font-style:normal;font-weight:100 900;font-display:swap;
        src:url('/fonts/GeistMono.woff2') format('woff2');
        unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      #loading-screen {
        position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f1f5f9;font-family:system-ui,sans-serif;
      }
      #loading-screen .logo-img {
        width:48px;height:48px;margin-bottom:16px;animation:pulse 1.5s ease-in-out infinite;
      }
      #loading-screen .spinner {
        width:28px;height:28px;border:2.5px solid #cbd5e1;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;
      }
      #loading-screen p {
        margin-top:12px;color:#475569;font-size:13px;font-weight:600;letter-spacing:.04em;
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes pulse { 0%, 100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.08); opacity:0.85; } }
    </style>
    <link rel="preload" as="font" href="/fonts/Geist.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/GeistMono.woff2" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SociHR - Social Media Engagement Monitor for HR teams. Track employee engagement across platforms with real-time insights and reporting." />
    <title>SociHR @syaakiirr</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen">
        <img src="/logo.png" alt="SociHR Logo" class="logo-img" />
        <div class="spinner"></div>
        <p>SociHR</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
